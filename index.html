<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>WINKO / JUTARAMA Factory Control + Lorry Planner</title>
<style>
:root{--navy:#17324d;--blue:#2f5d7c;--light:#eaf2f8;--bg:#f6f8fb;--text:#1f2937;--muted:#687483;--border:#d9e1e8;--green:#e6f4e4;--greenT:#2f6b2f;--amber:#fff5cf;--amberT:#886400;--red:#fde6e6;--redT:#a12626;--white:#fff;--shadow:0 8px 28px rgba(23,50,77,.08)}

:20px}h1{margin:0;font-size:26px}.sub{margin-top:5px;color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--border);background:#fff;padding:9px 12px;border-radius:8px;font-weight:750;cursor:pointer}.btn.primary{background:var(--blue);color:#fff;border-color:var(--blue)}.btn.danger{background:#fff;color:#a61b1b;border-color:#e4b4b4}.btn.danger:hover{background:#fff1f1;border-color:#d97c7c}.card{background:#fff;border:1px solid var(--border);border-radius:13px;box-shadow:var(--shadow)}.section{padding:17px;margin-bottom:17px}.sectionHead{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:13px}.sectionHead h2{margin:0;font-size:17px}.toolbar{display:flex;gap:8px;flex-wrap:wrap}.monthTabs{display:flex;gap:7px;flex-wrap:wrap;margin:0 0 14px}.monthTab{border:1px solid var(--border);background:#fff;color:#49657b;border-radius:9px;padding:8px 11px;font-size:11px;font-weight:850;cursor:pointer}.monthTab:hover{background:#f5f9fc}.monthTab.active{background:var(--navy);border-color:var(--navy);color:#fff}.monthTab .count{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;margin-left:6px;border-radius:999px;background:rgba(47,93,124,.1);font-size:9px}.monthTab.active .count{background:rgba(255,255,255,.18)}.monthTitle{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}.monthCode{font-size:11px;color:var(--muted);font-weight:800}.input,select,textarea{border:1px solid var(--border);border-radius:8px;padding:8px 9px;background:#fff;color:var(--text)}.input{min-width:230px}.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:17px}.kpi{padding:17px}.kpi .lab{font-size:11px;font-weight:850;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}.kpi .val{font-size:30px;font-weight:850;margin-top:6px}.tableWrap{overflow:auto;border:1px solid var(--border);border-radius:9px}table{border-collapse:collapse;width:100%;min-width:1000px} .authGate{position:fixed;inset:0;z-index:99999;background:linear-gradient(135deg,#eef4f8,#dfeaf1);display:flex;align-items:center;justify-content:center;padding:20px}
.authGate.hidden{display:none}.authCard{width:min(430px,100%);background:#fff;border:1px solid #cfdae2;border-radius:18px;box-shadow:0 24px 70px rgba(23,50,77,.18);padding:30px}.authBrand{display:flex;align-items:center;gap:16px;margin-bottom:22px}.authBrand img{width:116px;height:66px;object-fit:contain;object-position:center;border-radius:0;background:transparent}.authBrand h2{margin:0;color:#17324d;font-size:22px}.authBrand p{margin:4px 0 0;color:#687888;font-size:13px}.authCard label{display:block;font-size:12px;font-weight:800;color:#455665;margin:14px 0 6px}.authCard input{width:100%;box-sizing:border-box;border:1px solid #bccbd6;border-radius:10px;padding:12px 13px;font:inherit}.authCard button{width:100%;margin-top:18px;border:0;border-radius:10px;padding:12px 14px;background:#17324d;color:#fff;font-weight:800;cursor:pointer}.authCard .authSecondary{margin-top:8px;background:#eef3f7;color:#17324d;border:1px solid #ccd8e0}.authMsg{min-height:20px;margin-top:12px;font-size:12px;color:#8a3131}.dbBadge{position:fixed;right:18px;bottom:16px;z-index:9990;display:flex;align-items:center;gap:8px;background:#fff;border:1px solid #ccd8e0;border-radius:999px;padding:8px 11px;box-shadow:0 8px 24px rgba(23,50,77,.12);font-size:11px;font-weight:800;color:#526270}.dbDot{width:8px;height:8px;border-radius:50%;background:#d09b36}.dbBadge.connected .dbDot{background:#2f8a52}.dbBadge.error .dbDot{background:#b74646}.dbSignOut{border:0;background:transparent;color:#17324d;font-weight:800;cursor:pointer;padding:0 2px}.dbSaving{color:#9a6b1f}


.meetingKpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}.meetingKpi{padding:14px}.meetingKpi .val{font-size:28px;font-weight:900}.meetingKpi .lab{font-size:10px;font-weight:850;color:var(--muted);text-transform:uppercase}.meetingToolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.meetingTable table{min-width:1450px}.meetingTable td{vertical-align:middle}.meetingIssue{max-width:230px;white-space:normal;line-height:1.35}.meetingAction{max-width:260px;white-space:normal;line-height:1.35}.meetingCritical td{background:#fff5f5!important}.meetingSoon td{background:#fffaf0!important}@media(max-width:900px){.meetingKpis{grid-template-columns:repeat(2,1fr)}}

/* Combined v10: isolated 3D lorry planner module */
.lorryModuleBar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;padding:12px 14px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
.lorryModuleBar .moduleInfo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.lorryModuleBar .moduleInfo b{color:var(--navy)}.moduleBadge{font-size:10px;font-weight:850;padding:5px 8px;border-radius:999px;background:#eef5fa;color:var(--blue);border:1px solid #d6e4ee}
.lorryShell{height:calc(100vh - 165px);min-height:720px;background:#fff;border:1px solid var(--border);border-radius:13px;overflow:hidden;box-shadow:var(--shadow)}
.lorryFrame{display:block;width:100%;height:100%;border:0;background:#eef3f8}
@media(max-width:1050px){.quickActions{grid-template-columns:repeat(2,1fr)}.lorryShell{height:900px;min-height:720px}}
@media(max-width:720px){.quickActions{grid-template-columns:1fr}.lorryShell{height:1100px;min-height:820px}.lorryModuleBar{align-items:flex-start}}

/* Combined BOM generator module */
.bomModuleBar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px;padding:12px 14px;background:#fff;border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow)}
.bomModuleBar .moduleInfo{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.bomModuleBar .moduleInfo b{color:var(--navy)}
.bomShell{height:calc(100vh - 165px);min-height:760px;background:#fff;border:1px solid var(--border);border-radius:13px;overflow:hidden;box-shadow:var(--shadow)}
.bomFrame{display:block;width:100%;height:100%;border:0;background:#f3f7fa}
@media(max-width:1050px){.bomShell{height:920px;min-height:760px}}
@media(max-width:720px){.bomShell{height:1150px;min-height:900px}.bomModuleBar{align-items:flex-start}}

async function startDatabaseSession(){
  setDbStatus('Connecting to cloud…','');
  try{
    const result=await simpleApi('load');
    dbReady=true;
    if(result?.data&&Array.isArray(result.data.jobs)&&result.data.jobs.length){
      const duplicatesRemoved=applyLoadedState(result.data);
      saveLocalCache();
      if(duplicatesRemoved>0)await persistRemote()

      loadLocalState();normalizeAllJobs();getSettings();ensureWorkflow();applyBrand();renderNav();render();
      await persistRemote();

function meetingRisk(j){
  if(j.deliveryStatus==='Delivered')return 9;
  const dn=daysLeft(j.deliveryDate), an=daysLeft(j.nextActionDue);
  if(dn!==null&&dn<0)return 0;
  if(an!==null&&an<0)return 1;
  if(dn!==null&&dn<=2)return 2;
  const st=activeStageKey(j), sn=st?daysLeft(j.stageDue?.[st]):null;
  if(sn!==null&&sn<0)return 3;
  if(j.priority==='URGENT')return 4;
  if(dn!==null&&dn<=7)return 5;
  if(!j.deliveryDate)return 7;
  return 6;
}

function recalcActiveDeadlines(){const seen=new Set();state.jobs.filter(j=>!j.archived).forEach(j=>{if(seen.has(j.ref))return;seen.add(j.ref);const active=activeStageKey(j);if(active)resetFutureDue(j,stages.indexOf(active))});ensureWorkflow()}
function saveSettings(){const x=getSettings(),oldDays={...x.stageDays};const stageNames={},stageDays={};stages.forEach(st=>{stageNames[st]=cleanText(document.getElementById(`sName_${st}`).value,40)||defaultStageLabels[st];stageDays[st]=Math.max(1,Math.min(30,Number(document.getElementById(`sDays_${st}`).value)||3))});state.settings={...x,stageNames,stageDays,urgentDays:Math.max(0,Math.min(30,Number(sUrgent.value)||3)),tbcLabel:cleanText(sTbc.value,20)||'TBC'};stageLabels={...stageNames};if(stages.some(st=>stageDays[st]!==oldDays[st]))recalcActiveDeadlines();applyBrand();logActivity('Project Milestone settings updated');persist();renderSettings()}
function resetSettings(){state.settings={slaDays:3,tbcLabel:'TBC',urgentDays:3,stageNames:{...defaultStageLabels},stageDays:{drawingBom:3,purchasing:3,fabrication:3,finishing:3,packing:3,delivery:3}};stageLabels={...defaultStageLabels};recalcActiveDeadlines();applyBrand();persist();renderSettings()}
function renderArchive(){title('Archive','Archived PO lines are hidden from PO, Project Milestone and Delivery until restored.');const rows=state.jobs.filter(j=>j.archived).filter(matches);view.innerHTML=`<div class="card section"><div class="sectionHead"><div><h2>Archived PO Lines</h2><div class="note">Restore is recommended. Permanent delete cannot be undone.</div></div><input class="input" placeholder="Search archive..." value="${esc(state.search)}" oninput="state.search=this.value;renderArchive()"></div><div class="tableWrap"><table><thead><tr><th>Archived</th><th>Month</th><th>PO No.</th><th>Job</th><th>Customer</th><th>Project / Tank</th><th></th></tr></thead><tbody>${rows.map(j=>`<tr class="archiveRow"><td>${j.archivedAt?new Date(j.archivedAt).toLocaleString('en-MY'):'—'}</td><td>${esc(poMonthName(j.sourceMonth))}</td><td>${esc(j.poNo)}</td><td><b>${esc(j.ref)}</b></td><td>${esc(j.customer)}</td><td>${esc(j.project||j.tankSize)}</td><td><div class="actions"><button class="btn" onclick="restorePO('${j.id}')">Restore</button><button class="btn danger" onclick="permanentDelete('${j.id}')">Delete Permanently</button></div></td></tr>`).join('')}</tbody></table></div></div>`}
function restorePO(id){const j=state.jobs.find(x=>x.id===id);if(!j||!j.archived)return;const active=state.jobs.find(x=>!x.archived&&x.ref===j.ref);j.archived=false;delete j.archivedAt;if(active){j.stages={...(active.stages||{})};j.stageDates={...(active.stageDates||{})};j.stageDue={...(active.stageDue||{})};j.deliveryStatus=active.deliveryStatus||j.deliveryStatus;j.priority=active.priority||j.priority}ensureWorkflow();logActivity(`PO ${j.poNo||''} restored`,j.ref);persist();renderArchive()}
function permanentDelete(id){const j=state.jobs.find(x=>x.id===id);if(!j||!confirm(`Permanently delete ${j.poNo||''} / ${j.ref||''}?\n\nThis cannot be undone.`))return;state.jobs=state.jobs.filter(x=>x.id!==id);logActivity(`PO ${j.poNo||''} permanently deleted`,j.ref);persist();renderArchive()}
const fieldMap={fSource:'sourceMonth',fPoDate:'poDate',fPoNo:'poNo',fRef:'ref',fCustomer:'customer',fDoDate:'doDate',fDeliveryDate:'deliveryDate',fDoNo:'doNo',fTank:'tankSize',fProject:'project',fAddress:'projectAddress',fPoRemarks:'poRemarks',fPanel:'panel',fCover:'cover',fInstaller:'installer',fInstallerDate:'installerDate',fLetter:'letterCantInstall',fVoucher:'voucherCheque',fExtra:'extraWorks',fPriority:'priority',fStatus:'deliveryStatus',fBlocker:'blocker',fNextAction:'nextAction',fNextActionDue:'nextActionDue',fTransport:'transport',fSubcon:'subcon',fRemarks:'remarks'};
function openModal(id=null){state.editing=id;const j=id?state.jobs.find(x=>x.id===id):{sourceMonth:'',priority:'NORMAL',deliveryStatus:'Pending',stages:{drawingBom:false,purchasing:false,fabrication:false,finishing:false,packing:false,delivery:false},stageDates:{},stageDue:{}};modalTitle.textContent=id?'Edit PO / Job':'Add PO / Job';Object.entries(fieldMap).forEach(([el,k])=>document.getElementById(el).value=j[k]||'');syncPoMonthField(j.poDate||'');modal.classList.add('show')}function closeModal(){modal.classList.remove('show');state.editing=null}
function validateJobInput(o){if(!o.ref||!o.customer)return'Job / Reference and Customer are required.';for(const [k,label] of [['poDate','PO Date'],['deliveryDate','Delivery Date'],['installerDate','Installer Date'],['nextActionDue','Action Due Date']])if(!validISODate(o[k]))return`${label} is invalid.`;const exactDup=state.jobs.find(x=>!x.archived&&x.id!==state.editing&&duplicateLineKey(x)===duplicateLineKey(o));if(exactDup)return`This PO/job line already exists (${exactDup.poNo||'No PO No.'} / ${exactDup.ref}). Edit the existing line instead of adding a duplicate.`;const poDup=state.jobs.find(x=>!x.archived&&x.id!==state.editing&&o.poNo&&x.poNo&&x.poNo.toLowerCase()===o.poNo.toLowerCase()&&x.ref!==o.ref);if(poDup&&!confirm(`PO No. ${o.poNo} already exists under ${poDup.ref}.\n\nSave anyway?`))return'__cancel__';return''}
function saveJob(){const btn=document.getElementById('saveJobBtn');if(btn?.disabled)return;const o={};Object.entries(fieldMap).forEach(([el,k])=>o[k]=cleanText(document.getElementById(el).value,k==='remarks'||k==='poRemarks'||k==='projectAddress'?2000:500));o.sourceMonth=sourceMonthFromPoDate(o.poDate)||'';const err=validateJobInput(o);if(err){if(err!=='__cancel__')alert(err);return}btn.disabled=true;btn.textContent='Saving…';try{if(state.editing){const j=state.jobs.find(x=>x.id===state.editing);if(!j)return;const oldRef=j.ref,oldPo=j.poDate,st={...(j.stages||{})},sd={...(j.stageDates||{})},due={...(j.stageDue||{})},jobId=j.jobId;if(oldPo&&!o.poDate&&Object.values(st).some(Boolean)&&!confirm('Project Milestone has already started. Removing PO Date may reset project milestone due dates. Continue?'))return;Object.assign(j,o);j.jobId=jobId;state.jobs.filter(x=>!x.archived&&x.jobId===jobId&&x.id!==j.id).forEach(x=>{x.deliveryDate=o.deliveryDate;x.priority=o.priority;x.blocker=o.blocker;x.nextAction=o.nextAction;x.nextActionDue=o.nextActionDue;x.transport=o.transport;x.subcon=o.subcon;});j.stages=st;j.stageDates=sd;j.stageDue=due;if(j.deliveryStatus==='Delivered'){j.stages.delivery=true;j.stageDates.delivery=j.stageDates.delivery||isoToday()}else if(j.stages.delivery){j.stages.delivery=false;delete j.stageDates.delivery}logActivity(`PO ${j.poNo||''} updated`,j.ref);if(oldRef!==j.ref)logActivity(`Job reference changed from ${oldRef}`,j.ref)}else{const existing=state.jobs.find(x=>!x.archived&&x.ref.trim().toLowerCase()===o.ref.trim().toLowerCase());const j=normalizeJob({id:crypto.randomUUID(),jobId:existing?.jobId||(crypto.randomUUID?crypto.randomUUID():`job-${Date.now()}`),...o,stages:{drawingBom:false,purchasing:false,fabrication:false,finishing:false,packing:false,delivery:false},stageDates:{},stageDue:{}});state.jobs.push(j);logActivity(`PO ${j.poNo||''} added`,j.ref)}normalizeAllJobs();ensureWorkflow();persist();closeModal();render()}finally{if(btn){btn.disabled=false;btn.textContent='Save'}}}

function importNorm(v){return String(v??'').trim().replace(/[‘’´`′]/g,"'").replace(/[“”″]/g,'"').replace(/\s+/g,' ').toLowerCase()}
function dimensionNorm(v){return importNorm(v).replace(/[×✕]/g,'x').replace(/(\d)\s*[xX]\s*(?=\d)/g,'$1x')}
function projectDuplicateKey(j){return [importNorm(j.sourceMonth),importNorm(j.poNo),importNorm(j.ref),importNorm(j.customer),dimensionNorm(j.tankSize),importNorm(j.project)].join('|')}
function projectIdentityKey(j){return [importNorm(j.poNo),importNorm(j.ref),importNorm(j.customer),dimensionNorm(j.tankSize),importNorm(j.project)].join('|')}
function projectFamilyKey(j){return [importNorm(j.poNo),importNorm(j.ref),importNorm(j.customer),importNorm(j.project)].join('|')}
function buildImportPatch(existing,incoming,managedFields){const patch={};const fields=managedFields||['sourceMonth','poDate','poNo','ref','customer','doDate','doNo','tankSize','poRemarks','project','projectAddress','panel','cover','installer','installerDate','letterCantInstall','extraWorks','remarks'];for(const k of fields){const max=k==='remarks'||k==='poRemarks'||k==='projectAddress'?2000:500;const v=cleanText(incoming[k],max),old=cleanText(existing[k],max);if(old!==v)patch[k]=v}return patch}
function excelCellToDateOrText(v){
  if(v===null||v===undefined||v==='')return'';
  if(v instanceof Date&&!isNaN(v))return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;
  if(typeof v==='number'&&window.XLSX?.SSF){const d=XLSX.SSF.parse_date_code(v);if(d)return `${String(d.y).padStart(4,'0')}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`}
  const t=cleanText(v,500);if(!t)return'';
  if(/^\d{4}-\d{2}-\d{2}$/.test(t))return t;
  const d=new Date(t);if(!isNaN(d)&&/[0-9]/.test(t))return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  return t
}
function excelCellToISO(v){
  if(!v)return'';
  if(v instanceof Date&&!isNaN(v))return `${v.getFullYear()}-${String(v.getMonth()+1).padStart(2,'0')}-${String(v.getDate()).padStart(2,'0')}`;
  if(typeof v==='number'&&window.XLSX?.SSF){const d=XLSX.SSF.parse_date_code(v);if(d)return `${String(d.y).padStart(4,'0')}-${String(d.m).padStart(2,'0')}-${String(d.d).padStart(2,'0')}`}
  const t=String(v).trim();
  if(/^\d{4}-\d{2}-\d{2}$/.test(t))return t;
  const d=new Date(t);return isNaN(d)?'':`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`
}
function makeImportJobId(row,sourceMonth,jobMap){
  const ref=cleanText(row[3],500),po=cleanText(row[2],500),cust=cleanText(row[1],500);
  const meaningfulRef=ref&&ref!=='-';
  const key=meaningfulRef?`ref:${importNorm(ref)}`:`po:${importNorm(sourceMonth)}|${importNorm(po)}|${importNorm(cust)}`;
  if(!jobMap.has(key))jobMap.set(key,(crypto.randomUUID?crypto.randomUUID():`job-${Date.now()}-${Math.random().toString(36).slice(2)}`));
  return jobMap.get(key)
}
async function importProjectListFile(file){
  const input=document.getElementById('projectImportInput');
  try{
    if(!file)return;
    if(!window.XLSX)throw new Error('Excel importer could not load. Check internet access and reload the page.');
    setDbStatus('Reading project list…','connected');
    const wb=XLSX.read(await file.arrayBuffer(),{type:'array',cellDates:true});
    const monthSheets=wb.SheetNames.filter(n=>/^26(0[1-9]|1[0-2])$/.test(String(n)));
    if(!monthSheets.length)throw new Error('No monthly sheets such as 2607 or 2608 were found.');

    // First repair old saved month assignments. July PO dates must be 2607, August must be 2608, etc.
    const beforeRepair=JSON.stringify(snapshotState());
    const initialRepair=normalizeAllJobs();
    const refToJobId=new Map();
    state.jobs.forEach(j=>{if(j.ref&&j.ref!=='-'&&j.jobId)refToJobId.set(`ref:${importNorm(j.ref)}`,j.jobId)});

    const parsedJobs=[],incomingKeys=new Set();
    let duplicateRows=0,skipped=0,readRows=0,sheetMonthCorrections=0;
    for(const sheetMonth of monthSheets){
      const rows=XLSX.utils.sheet_to_json(wb.Sheets[sheetMonth],{header:1,defval:'',raw:true});
      const headerRow=(rows[0]||[]).map(v=>String(v??'').trim().toLowerCase().replace(/[^a-z0-9]+/g,' '));
      const deliveryAliases=['expected delivery date','expected delivery','target delivery date','target delivery dated','trget delivery dated','delivery date','delivery dated'];
      let expectedDeliveryCol=-1,voucherCol=-1;
      for(const alias of deliveryAliases){expectedDeliveryCol=headerRow.findIndex(h=>h===alias||h.includes(alias));if(expectedDeliveryCol>=0)break}
      voucherCol=headerRow.findIndex(h=>h==='voucher'||h==='cheque'||h.includes('voucher cheque')||h.includes('voucher')||h.includes('cheque'));
      for(let i=1;i<rows.length;i++){
        const r=rows[i]||[];
        if(!r.some(v=>String(v??'').trim()))continue;
        readRows++;
        const customer=cleanText(r[1],500),poNo=cleanText(r[2],500),rawRef=cleanText(r[3],500),tankSize=cleanText(r[6],500),project=cleanText(r[8],500);
        if(!customer||(!poNo&&!rawRef&&!tankSize&&!project)){skipped++;continue}
        const ref=rawRef||'-',poDate=excelCellToISO(r[0]);
        const dateMonth=sourceMonthFromPoDate(poDate),sourceMonth=dateMonth;
        if(dateMonth&&dateMonth!==String(sheetMonth))sheetMonthCorrections++;
        const job={
          id:(crypto.randomUUID?crypto.randomUUID():`line-${Date.now()}-${Math.random().toString(36).slice(2)}`),
          jobId:makeImportJobId(r,sourceMonth,refToJobId),sourceMonth,poDate,poNo,ref,customer,
          doDate:excelCellToDateOrText(r[4]),deliveryDate:expectedDeliveryCol>=0?excelCellToISO(r[expectedDeliveryCol]):'',doNo:cleanText(r[5],500),tankSize,poRemarks:cleanText(r[7],2000),project,projectAddress:cleanText(r[9],2000),
          panel:cleanText(r[10],500),cover:cleanText(r[11],500),installer:cleanText(r[12],500),installerDate:excelCellToISO(r[13]),letterCantInstall:cleanText(r[14],500),
          voucherCheque:voucherCol>=0?cleanText(r[voucherCol],500):'',extraWorks:cleanText(r[16],500),remarks:cleanText(r[17],2000),priority:'NORMAL',deliveryStatus:'Pending',pic:'',transport:'',subcon:'',
          stages:{drawingBom:false,purchasing:false,fabrication:false,finishing:false,packing:false,delivery:false},stageDates:{},stageDue:{}
        };
        job._excelManaged=['sourceMonth','poDate','poNo','ref','customer','doDate','doNo','tankSize','poRemarks','project','projectAddress','panel','cover','installer','installerDate','letterCantInstall','extraWorks','remarks'];
        if(expectedDeliveryCol>=0)job._excelManaged.push('deliveryDate');
        if(voucherCol>=0)job._excelManaged.push('voucherCheque');
        const identity=projectIdentityKey(job);
        if(incomingKeys.has(identity)){duplicateRows++;continue}
        incomingKeys.add(identity);parsedJobs.push(job)
      }
    }

    // Index existing records after repair. Family matching is only used where both sides have exactly one line,
    // so legitimate multi-tank/multi-item POs are never collapsed together.
    const existingByIdentity=new Map(),existingByFamily=new Map();
    state.jobs.filter(j=>!j.archived).forEach(j=>{
      const idKey=projectIdentityKey(j),fam=projectFamilyKey(j);
      if(!existingByIdentity.has(idKey))existingByIdentity.set(idKey,j);
      if(!existingByFamily.has(fam))existingByFamily.set(fam,[]);
      existingByFamily.get(fam).push(j)
    });
    const incomingFamilyCounts=new Map();
    parsedJobs.forEach(j=>{const f=projectFamilyKey(j);incomingFamilyCounts.set(f,(incomingFamilyCounts.get(f)||0)+1)});

    const additions=[],updates=[],consumedExistingIds=new Set();
    let deliveryDatesImported=0,safeChangedLineMatches=0;
    for(const job of parsedJobs){
      const identity=projectIdentityKey(job),family=projectFamilyKey(job);
      let existing=existingByIdentity.get(identity);
      if(existing&&consumedExistingIds.has(existing.id))existing=null;
      if(!existing&&incomingFamilyCounts.get(family)===1){
        const candidates=(existingByFamily.get(family)||[]).filter(x=>!consumedExistingIds.has(x.id));
        if(candidates.length===1){existing=candidates[0];safeChangedLineMatches++}
      }
      if(existing){
        consumedExistingIds.add(existing.id);
        const patch=buildImportPatch(existing,job,job._excelManaged);
        if(Object.keys(patch).length)updates.push({id:existing.id,patch,ref:existing.ref||job.ref})
      }else{
        if(job.deliveryDate)deliveryDatesImported++;
        {const {_excelManaged,...cleanJob}=job;additions.push(cleanJob)}
      }
    }

    const autoMonthFixed=initialRepair.monthFixed||0,autoDuplicatesRemoved=initialRepair.removed||0;
    const msg=`Sync Project List?\n\nFile: ${file.name}\nSheets: ${monthSheets.join(', ')}\nRows read: ${readRows}\nValid PO lines in Excel: ${parsedJobs.length}\nNew PO lines: ${additions.length}\nExisting PO lines to update: ${updates.length}\nChanged tank/item lines safely matched: ${safeChangedLineMatches}\nExisting wrong month lines auto-fixed: ${autoMonthFixed}\nDuplicate saved lines removed: ${autoDuplicatesRemoved}\nDuplicate Excel rows ignored: ${duplicateRows}\nInvalid/blank rows skipped: ${skipped}\n\nThe Excel file is treated as the latest PO master data. Matching records are UPDATED, not rejected as duplicates. PO Date controls the PO month (July → 2607, August → 2608). Inv/DO Date and Inv/DO No. are synced separately from Excel columns E and F, including TBC/blank values.`;
    if(!additions.length&&!updates.length&&!autoMonthFixed&&!autoDuplicatesRemoved){alert(`${msg}\n\nYour system already matches this Project List.`);setDbStatus('Project list already up to date','connected');return}
    if(!confirm(msg)){
      if(autoMonthFixed||autoDuplicatesRemoved){try{const rollback=JSON.parse(beforeRepair);state.jobs=rollback.jobs;state.activity=rollback.activity||state.activity;state.settings={...state.settings,...(rollback.settings||{})};normalizeAllJobs();ensureWorkflow();renderNav();render()}catch{}}
      return
    }
    localStorage.setItem(STORAGE_KEY+'_pre_project_import',beforeRepair);
    for(const u of updates){const j=state.jobs.find(x=>x.id===u.id);if(j)Object.assign(j,u.patch)}
    state.jobs.push(...additions);
    const finalRepair=normalizeAllJobs();ensureWorkflow();
    logActivity(`Project List synced: ${additions.length} new, ${updates.length} updated, ${autoMonthFixed+finalRepair.monthFixed} month correction(s)`);
    persist();renderNav();render();
    alert(`Project List sync completed.\n\n${additions.length} new PO line(s) added.\n${updates.length} existing PO line(s) updated.\n${safeChangedLineMatches} changed tank/item line(s) matched to the existing PO instead of duplicated.\n${autoMonthFixed+finalRepair.monthFixed} wrong Source Month line(s) corrected.\n${autoDuplicatesRemoved+finalRepair.removed} duplicate saved line(s) removed.\n${deliveryDatesImported} Delivery Date(s) imported on new lines.\n${duplicateRows} duplicate Excel row(s) ignored.\n${skipped} invalid/blank row(s) skipped.`)
  }catch(e){console.error(e);alert(`Cannot import project list: ${e.message||e}`);setDbStatus('Project import failed','error')}
  finally{if(input)input.value=''}
}

function exportData(){const payload={version:DATA_VERSION,exportedAt:new Date().toISOString(),jobs:state.jobs,activity:state.activity||[],settings:getSettings()};const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.href=url;a.download=`jutarama-backup-${isoToday()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);localStorage.setItem(BACKUP_KEY,new Date().toLocaleString('en-MY'));setDbStatus('Backup downloaded','connected');if(state.view==='more')renderMore()}
async function importBackupFile(file){const input=document.getElementById('backupImportInput');try{if(!file)return;const text=await file.text();const data=JSON.parse(text);if(!data||!Array.isArray(data.jobs))throw new Error('Backup does not contain a valid jobs list.');const valid=data.jobs.every(x=>x&&typeof x==='object');if(!valid)throw new Error('Backup contains invalid job records.');const refs=new Set(data.jobs.map(x=>String(x.ref||'')).filter(Boolean));if(!confirm(`Restore this backup?\n\n${data.jobs.length} PO line(s)\n${refs.size} job reference(s)\nBackup: ${data.exportedAt?new Date(data.exportedAt).toLocaleString('en-MY'):'Unknown date'}\n\nThis will replace current local data.`))return;localStorage.setItem(STORAGE_KEY+'_rollback',JSON.stringify(snapshotState()));state.jobs=data.jobs;state.activity=Array.isArray(data.activity)?data.activity:[];state.settings={...state.settings,...(data.settings||{})};normalizeAllJobs();getSettings();ensureWorkflow();persist();renderNav();render();alert('Backup restored successfully.')}catch(e){alert(`Cannot restore backup: ${e.message||e}`)}finally{if(input)input.value=''}}
load();
</script></body></html>
